# Info for pixi-build
[package.build.backend]
name = "pixi-build-python"
version = "0.4.*"

[package.build.config]
ignore-pypi-mapping = false

[package.host-dependencies]
uv = "*"  # added for faster installation


[workspace]
preview = ["pixi-build"]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64", "osx-64"]

[pypi-dependencies]
fastplotlib = { git = "ssh://git@github.com/ethanbb/fastplotlib", branch = "a16-numpy2", extras = ["notebook"] }
mesmerize-viz = { git = "ssh://git@github.com/proektlab/mesmerize-viz", branch = "master" }

[dependencies]
cmcode = { path = "." }
